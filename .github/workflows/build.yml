name: build-and-push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (ABI pin)"
        default: cu128-torch2.11.0
      max_jobs:
        description: "apex compile parallelism (nvcc uses ~2 GB per job)"
        default: "4"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    # apex compiles six arch targets on 4 vCPUs; the job limit is 6 h.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          sudo apt-get clean
          df -h /

      - name: Move docker storage to the large temp disk
        # / has ~20 GB free; /mnt has ~65 GB. The build needs ~35 GB of layers.
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h /mnt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            MAX_JOBS=${{ inputs.max_jobs || '4' }}
          tags: ghcr.io/reecebw/cuda-torch-apex:${{ inputs.tag || 'cu128-torch2.11.0' }}

      - name: Report digest
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/reecebw/cuda-torch-apex@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
